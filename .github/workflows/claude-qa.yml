# Claude QA: Setzt jemand das Label `qa-verify` auf einen PR, prüft Claude Code
# das verlinkte GitHub-Issue (das Ticket) im echten Browser. Der Report mit
# Screenshots landet als PR-Kommentar.
#
# Zwei Jobs, damit der Agent nie Schreibrechte bekommt:
#   qa      Claude testet, nur Lesezugriff, schreibt qa-report/ als Artefakt
#   report  ohne Claude: Belege auf den Branch qa-evidence, Kommentar, Merge-Gate
name: Claude QA

on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA im Browser
    if: github.event.label.name == 'qa-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # Claude findet das verlinkte Issue über den PR
      issues: read # Claude liest das Issue (Ticket mit Akzeptanzkriterien)
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Agent Browser (aus dem Lockfile)
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/agent-browser install --with-deps
          # ffmpeg für `agent-browser record` (Video des QA-Laufs)
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Start shop (verify-otto-shop skill)
        run: .claude/skills/verify-otto-shop/scripts/otto-verify.sh launch

      - name: Claude QA (live)
        id: qa
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          ./node_modules/.bin/claude -p "$(envsubst < .github/prompts/qa.md)" \
            --model opus \
            --max-budget-usd 10 \
            --max-turns 300 \
            --allowedTools "Skill,Read,Write,Bash(agent-browser:*),Bash(.claude/skills/verify-otto-shop/scripts/otto-verify.sh:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(mkdir:*),Bash(cp:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(sort:*),Bash(export:*)" \
            --json-schema "$(cat .github/prompts/qa-verdict.schema.json)" \
            --output-format stream-json --verbose < /dev/null \
            | node .github/scripts/claude-live-log.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report-pr-${{ github.event.pull_request.number }}
          path: qa-report/
          if-no-files-found: ignore

  report:
    name: Report und Merge-Gate
    needs: qa
    if: always() && needs.qa.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # legt Screenshots auf den Branch qa-evidence, damit sie im Kommentar sichtbar sind
      pull-requests: write # postet den Report als PR-Kommentar
    steps:
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-report-pr-${{ github.event.pull_request.number }}
          path: qa-report

      - name: Publish screenshots and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f qa-report/report.md || { echo "Claude hat keinen Report geschrieben"; exit 1; }
          DEST="pr-${PR_NUMBER}/run-${RUN_ID}"

          gh auth setup-git
          if git ls-remote --exit-code --heads "https://github.com/${REPO}.git" qa-evidence > /dev/null; then
            git clone --quiet --depth 1 --branch qa-evidence "https://github.com/${REPO}.git" evidence
          else
            git init --quiet --initial-branch qa-evidence evidence
            git -C evidence remote add origin "https://github.com/${REPO}.git"
          fi
          mkdir -p "evidence/${DEST}"
          cp -R qa-report/. "evidence/${DEST}/"
          git -C evidence add .
          git -C evidence -c user.name="github-actions[bot]" -c user.email="41898+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "QA-Belege PR #${PR_NUMBER}, Run ${RUN_ID}"
          git -C evidence push --quiet origin qa-evidence

          RAW="https://raw.githubusercontent.com/${REPO}/qa-evidence/${DEST}"
          BLOB="https://github.com/${REPO}/blob/qa-evidence/${DEST}"
          sed -e "s#](screenshots/#](${RAW}/screenshots/#g" \
              -e "s#](video/#](${BLOB}/video/#g" \
              qa-report/report.md > comment.md
          printf '\n\n---\nLive-Log und Artefakte: %s\n' "$RUN_URL" >> comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md

      - name: Merge gate
        env:
          VERDICT: ${{ needs.qa.outputs.verdict }}
        run: |
          echo "Urteil: ${VERDICT:-keins}"
          if [ -z "$VERDICT" ] || [ "$VERDICT" = "CRITICAL_BUGS" ]; then
            exit 1
          fi
